# Role of the server itself, aggregated from the ClusterRoles carrying
# okdp.io/aggregate-to-control-plane: read the platform, list projects, clean up OIDC
# clients. Everything a console user asks for is sent to the API server as that user,
# through impersonation. The OKDP roles (okdp-project-*, okdp-platform-admin, okdp-user)
# come from the okdp-rbac chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        okdp.io/aggregate-to-control-plane: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "okdp-control-plane-server.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "okdp-control-plane-server.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-aggregate-to-control-plane
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
    okdp.io/aggregate-to-control-plane: "true"
rules:
  # Users and groups are not restricted by name: the server prefixes every
  # name taken from a token with "oidc:", so none can be a system: name.
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
  # Projects are listed, then filtered by what the caller can read.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Credentials of the OIDC client provisioner.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
